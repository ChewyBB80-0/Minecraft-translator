name: Minecraft-translator
main: com.chewy.translator.plugin.MinecraftTranslator
version: 1.0-SNAPSHOT
api-version: 1.20
author: ChewyBB80-0
description: Universal chat translation plugin for Minecraft servers
website: https://github.com/ChewyBB80-0/Minecraft-translator

commands:
  language:
    description: Open the language selection GUI
    usage: /language
    aliases: [lang]
    permission: translator.language
  
  translate:
    description: Manage translation settings
    usage: /translate <on|off|bypass>
    permission: translator.translate

permissions:
  translator.*:
    description: Gives access to all translator permissions
    default: op
    children:
      translator.language: true
      translator.translate: true
      translator.bypass: true
  
  translator.language:
    description: Allows using the language command
    default: true
  
  translator.translate:
    description: Allows toggling translation
    default: true
  
  translator.bypass:
    description: Allows seeing original messages without translation
    default: op
