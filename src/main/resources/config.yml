# Minecraft Universal Translator Configuration

# Default language for players (en, es, fr, de, pt, ru, ja, ko, zh)
default-language: en

# Show original message when hovering over translated text
show-original-hover: true

# Enable translation cache to reduce API calls
cache-enabled: true

# Cache expiration time in hours
cache-expiry-hours: 48

# Supported languages
supported-languages:
  - en
  - es
  - fr
  - de
  - pt
  - ru
  - ja
  - ko
  - zh

# Translation provider configuration
translation:
  # Provider: google, deeptranslat, mymemory
  provider: deeptranslat
  
  # Google Cloud Translation API
  google:
    api-key: ""
    
  # DeepTranslate (free, no API key needed)
  deeptranslat:
    enabled: true
    
  # MyMemory (free, rate limited)
  mymemory:
    enabled: true

# Logging configuration
logging:
  # Enable translation logs for moderation
  enabled: false
  # Log file path
  log-file: "translations.log"

# Discord integration (Phase 2)
discord:
  enabled: false
  webhook-url: ""
  channel-id: ""
