<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Selector - Minecraft Translator v1.0</title>
    <!--
        Minecraft Universal Translator Plugin
        Copyright © 2026 ChewyBB80-0. All Rights Reserved.
        Proprietary and confidential. Unauthorized copying strictly prohibited.
        Owner: ChewyBB80-0 | GitHub: https://github.com/ChewyBB80-0
    -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Minecraft', 'Courier New', monospace;
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        
        .gui-container {
            background: #c6c6c6;
            padding: 20px;
            border: 4px solid #000;
            width: 400px;
            position: relative;
        }
        
        .version-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #4a90e2;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
        }
        
        .gui-title {
            color: #404040;
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .search-bar {
            width: 100%;
            padding: 10px;
            border: 2px solid #7f7f7f;
            background: #000;
            color: #fff;
            font-family: inherit;
            margin-bottom: 15px;
        }
        
        .language-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .language-item {
            background: #8b8b8b;
            border: 2px solid #373737;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .language-item:hover {
            background: #a0a0a0;
        }
        
        .language-item.selected {
            background: #5a5a5a;
            border-color: #fff;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        
        .language-flag {
            font-size: 32px;
            display: block;
            margin-bottom: 5px;
        }
        
        .language-name {
            font-size: 12px;
            color: #fff;
        }
        
        .selected-info {
            background: #000;
            padding: 10px;
            color: #fff;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="gui-container">
        <div class="gui-title">Select Your Language</div>
        <span class="version-badge">v1.0.0</span>
        <input type="text" class="search-bar" placeholder="Search language...">
        
        <div class="language-grid">
            <div class="language-item selected" onclick="selectLanguage(this, 'English')">
                <span class="language-flag">🇺🇸</span>
                <span class="language-name">English</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'Spanish')">
                <span class="language-flag">🇪🇸</span>
                <span class="language-name">Spanish</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'French')">
                <span class="language-flag">🇫🇷</span>
                <span class="language-name">French</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'German')">
                <span class="language-flag">🇩🇪</span>
                <span class="language-name">German</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'Portuguese')">
                <span class="language-flag">🇧🇷</span>
                <span class="language-name">Portuguese</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'Russian')">
                <span class="language-flag">🇷🇺</span>
                <span class="language-name">Russian</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'Japanese')">
                <span class="language-flag">🇯🇵</span>
                <span class="language-name">Japanese</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'Korean')">
                <span class="language-flag">🇰🇷</span>
                <span class="language-name">Korean</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'Chinese')">
                <span class="language-flag">🇨🇳</span>
                <span class="language-name">Chinese</span>
            </div>
        </div>
        
        <div class="selected-info" id="selectedInfo">
            Selected: English
        </div>
        
        <div style="margin-top: 15px; text-align: center; font-size: 10px; color: #666; border-top: 1px solid #aaa; padding-top: 10px;">
            Minecraft Universal Translator by ChewyBB80-0 | © 2026 All Rights Reserved
        </div>
    </div>
    
    <script>
        // Minecraft Translator - Language Selector Module
        // Owner: ChewyBB80-0 | Version: 1.0.0
        // Copyright © 2026 ChewyBB80-0. Unauthorized use prohibited.
        
        const OWNER = "ChewyBB80-0";
        const VERSION = "1.0.0";
        const PROJECT = "Minecraft-translator";
        
        function selectLanguage(element, lang) {
            document.querySelectorAll('.language-item').forEach(item => {
                item.classList.remove('selected');
            });
            element.classList.add('selected');
            document.getElementById('selectedInfo').textContent = 'Selected: ' + lang;
            console.log(`[Translator] Language set to ${lang} by ${OWNER}`);
        }
        
        // ChewyBB80-0 watermark verification
        (function verifyOwnership() {
            const hash = btoa(OWNER + VERSION).substring(0, 8);
            console.log(`%c${PROJECT} ${VERSION}%c | Owner: ${OWNER} | Hash: ${hash}`, 
                'color: #4a90e2; font-weight: bold', 'color: #888');
        })();
    </script>
</body>
</html>
