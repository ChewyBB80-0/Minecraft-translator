<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Selector - Minecraft Translator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Minecraft', 'Courier New', monospace;
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        
        .gui-container {
            background: #c6c6c6;
            padding: 20px;
            border: 4px solid #000;
            width: 400px;
        }
        
        .gui-title {
            color: #404040;
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .search-bar {
            width: 100%;
            padding: 10px;
            border: 2px solid #7f7f7f;
            background: #000;
            color: #fff;
            font-family: inherit;
            margin-bottom: 15px;
        }
        
        .language-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .language-item {
            background: #8b8b8b;
            border: 2px solid #373737;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .language-item:hover {
            background: #a0a0a0;
        }
        
        .language-item.selected {
            background: #5a5a5a;
            border-color: #fff;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        
        .language-flag {
            font-size: 32px;
            display: block;
            margin-bottom: 5px;
        }
        
        .language-name {
            font-size: 12px;
            color: #fff;
        }
        
        .selected-info {
            background: #000;
            padding: 10px;
            color: #fff;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="gui-container">
        <div class="gui-title">Select Your Language</div>
        <input type="text" class="search-bar" placeholder="Search language...">
        
        <div class="language-grid">
            <div class="language-item selected" onclick="selectLanguage(this, 'English')">
                <span class="language-flag">🇺🇸</span>
                <span class="language-name">English</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'Spanish')">
                <span class="language-flag">🇪🇸</span>
                <span class="language-name">Spanish</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'French')">
                <span class="language-flag">🇫🇷</span>
                <span class="language-name">French</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'German')">
                <span class="language-flag">🇩🇪</span>
                <span class="language-name">German</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'Portuguese')">
                <span class="language-flag">🇧🇷</span>
                <span class="language-name">Portuguese</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'Russian')">
                <span class="language-flag">🇷🇺</span>
                <span class="language-name">Russian</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'Japanese')">
                <span class="language-flag">🇯🇵</span>
                <span class="language-name">Japanese</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'Korean')">
                <span class="language-flag">🇰🇷</span>
                <span class="language-name">Korean</span>
            </div>
            <div class="language-item" onclick="selectLanguage(this, 'Chinese')">
                <span class="language-flag">🇨🇳</span>
                <span class="language-name">Chinese</span>
            </div>
        </div>
        
        <div class="selected-info" id="selectedInfo">
            Selected: English
        </div>
    </div>
    
    <script>
        function selectLanguage(element, lang) {
            document.querySelectorAll('.language-item').forEach(item => {
                item.classList.remove('selected');
            });
            element.classList.add('selected');
            document.getElementById('selectedInfo').textContent = 'Selected: ' + lang;
        }
    </script>
</body>
</html>
